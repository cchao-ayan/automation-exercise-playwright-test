name: Playwright Tests

on:
  workflow_dispatch:
  
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Auth Setup - Create Storage State
        run: npm run pw:setup
      
      - name: Run Playwright tests - Login Functionality
        run: npm run pw:login

      - name: Run Playwright tests - Signup Functionality
        run: npm run pw:signup
      
      - name: Run Playwright tests - Footer Functionality
        run: npm run pw:footer

      - name: Run Playwright tests - end-to-end scenario
        run: npm run pw:scenario
        
      - name: Generate Allure Report
        if: always()
        run: npm run pw:allure

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    if: always()
    needs: test

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4